# Mises à jour suivies par Dependabot (story 42.1, issue #568).
# Une PR groupée par écosystème et par mois ; chacune passe la même CI que
# toute PR et se fusionne par la règle 15 d'AGENTS.md quand elle est verte.
# Les versions majeures npm restent à la main (changements d'API à lire).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns: ["*"]
