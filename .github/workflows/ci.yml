name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Tests unitaires (détecteur de côtes, parseur Wikipédia)
        run: npm test
      - name: Démo de validation auto-vérifiée (mode hors-ligne, 9 checks)
        run: npm run demo
