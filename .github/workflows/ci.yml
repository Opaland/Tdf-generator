name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Tests unitaires (détecteur de côtes, parseur Wikipédia)
        run: npm test
      - name: Démo de validation auto-vérifiée (mode hors-ligne, 9 checks)
        run: npm run demo

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker (kit Synology/VPS)
        run: docker build -t etapeforge:ci .
      - name: Smoke test du conteneur
        run: |
          docker run -d --name ef -p 4567:4567 -e ETAPEFORGE_OFFLINE=1 etapeforge:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4567/api/status > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:4567/api/status | grep -q '"offline":true'
          docker logs ef
          docker rm -f ef
