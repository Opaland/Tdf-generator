name: Démo interactive GitHub Pages

# Publie l'application interactive complète (frontend + données JSON
# pré-générées, en ligne quand possible sinon via le simulateur hors-ligne)
# sur GitHub Pages à chaque push sur main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le cache SQLite d'ÉtapeForge est réutilisé d'un build à l'autre : on ne
      # re-géocode/re-route/re-échantillonne jamais deux fois la même chose.
      - name: Restaurer le cache de données
        uses: actions/cache@v4
        with:
          path: data
          key: etapeforge-data-${{ github.run_id }}
          restore-keys: |
            etapeforge-data-
      - name: Générer la démo avec les APIs réelles (routes et altimétrie vraies)
        run: |
          node scripts/demo.js --online || {
            echo "::warning::APIs externes indisponibles — repli sur le simulateur hors-ligne";
            rm -rf data && npm run demo;
          }
      - name: Construire la démo statique
        run: node scripts/build-site.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
