<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ÉtapeForge — Carte globale</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Carte globale d'un tour</h1>
  <div class="toolbar">
    <label class="field" style="min-width:280px;margin:0">Tour / édition
      <select id="sel-edition"></select>
    </label>
    <button id="btn-anim" class="secondary">▶ Animation étape par étape</button>
    <a class="btn secondary" id="exp-site" target="_blank">Mini-site HTML autonome</a>
  </div>
  <div class="legend" id="legend"></div>
  <div id="map" style="height:560px"></div>
  <div id="tour-note"></div>
  <div class="statgrid" id="tour-stats"></div>
  <h2>Étapes — statistiques (cliquez un en-tête pour trier)</h2>
  <div class="card scrollx">
    <table class="stats" id="tour-stages">
      <thead><tr>
        <th data-k="order">#</th><th data-k="name">Étape</th><th data-k="date">Date</th>
        <th data-k="type">Type</th><th data-k="off">Km off.</th><th data-k="gen">Km reconst.</th>
        <th data-k="delta">Écart %</th><th data-k="dplus">D+ (m)</th><th data-k="nclimbs">Côtes</th>
        <th data-k="maxcat">Max cat.</th><th data-k="maxgrad">Pente max %</th><th data-k="summit">Sommet (m)</th>
        <th data-k="state">État</th>
      </tr></thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table>
  </div>
</main>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/common.js"></script>
<script src="/profile.js"></script>
<script src="/tourmap.js"></script>
</body>
</html>
