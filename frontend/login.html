<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#141414">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>ÉtapeForge — Connexion</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main style="max-width: 420px; margin: 60px auto;">
  <!-- Mêmes couleurs que le bandeau des autres pages : le jaune sur fond
       clair n'atteignait qu'environ 1,4:1 de contraste. -->
  <h1 style="text-align:center"><span style="display:inline-block;background:var(--noir);color:var(--jaune);padding:4px 14px;border-radius:var(--radius-md)">Étape<span style="color:#fff">Forge</span></span></h1>
  <div class="card">
    <div class="toolbar" style="justify-content:center">
      <button id="tab-login" class="tab active" type="button">Se connecter</button>
      <button id="tab-register" class="tab" type="button">Créer un compte</button>
    </div>
    <form id="auth-form">
      <label class="field">Email
        <input id="f-email" type="email" autocomplete="username" required>
      </label>
      <label class="field">Mot de passe
        <input id="f-password" type="password" autocomplete="current-password" required minlength="8">
      </label>
      <button id="f-submit" type="submit">Se connecter</button>
      <p id="auth-msg" class="meta-line" role="status"></p>
    </form>
  </div>
</main>
<script src="/common.js"></script>
<script src="/login.js"></script>
</body>
</html>
