# ÉtapeForge sur Synology (Container Manager → Projet) ou tout hôte Docker.
# Sécurité par défaut :
#  - conteneur non-root, sans capacités, sans élévation de privilèges ;
#  - système de fichiers en lecture seule : seul le volume /data est inscriptible
#    (base SQLite + caches) — l'app ne voit RIEN d'autre du NAS ;
#  - port publié en LAN uniquement : ne PAS créer de redirection de port dans la
#    box ; pour l'accès distant, utilisez Tailscale (voir docs/SYNOLOGY.md).
#
# Pour une exposition publique avec comptes (VPS + reverse proxy HTTPS), voir
# docs/DEPLOY-PUBLIC.md — NE PAS activer ETAPEFORGE_PUBLIC sur ce compose LAN.
services:
  etapeforge:
    build: .
    container_name: etapeforge
    ports:
      - "4567:4567"
    volumes:
      # Adaptez le chemin de gauche à votre NAS (dossier dédié, vide au départ).
      - /volume1/docker/etapeforge/data:/data
      # Sauvegarde automatique (désactivée par défaut) : décommentez ce volume
      # ET la variable ETAPEFORGE_BACKUP_DIR ci-dessous — idéalement un chemin
      # sur un DEUXIÈME volume physique du NAS (voir docs/SYNOLOGY.md, section
      # « Sauvegarde ») ; le même volume que /data ne protège de rien en cas
      # de panne disque.
      # - /volume2/docker/etapeforge/backup:/backup
    environment:
      - PORT=4567
      # - ETAPEFORGE_OFFLINE=1   # décommenter pour forcer le simulateur (démo)
      # - ETAPEFORGE_BACKUP_DIR=/backup          # active la sauvegarde automatique périodique
      # - ETAPEFORGE_BACKUP_INTERVAL_HOURS=24    # par défaut : une fois par jour
      # - ETAPEFORGE_BACKUP_KEEP=7                # par défaut : conserve les 7 dernières
      # Notification d'échec de génération (désactivée par défaut) : webhook
      # générique — ntfy.sh (auto-hébergeable), webhook entrant Slack/Discord,
      # ou tout récepteur JSON générique (Home Assistant, n8n…). Voir
      # docs/SYNOLOGY.md, section « Notifications ».
      # - ETAPEFORGE_NOTIFY_WEBHOOK_URL=https://ntfy.sh/mon-etapeforge
      # - ETAPEFORGE_NOTIFY_FORMAT=text          # "text" pour ntfy.sh ; JSON par défaut sinon
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
